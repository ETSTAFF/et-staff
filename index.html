<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hello angel17</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #f5f5f5;
      font-family: "Quicksand", sans-serif;
      background:
        radial-gradient(circle at top, #252525 0%, #111 38%, #050505 100%);
      overflow-x: hidden;
    }

    .stars,
    .floating {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: .7;
      animation: twinkle 2.5s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: .15;
        transform: scale(.8);
      }

      50% {
        opacity: .9;
        transform: scale(1.4);
      }
    }

    .float {
      position: absolute;
      color: rgba(255,255,255,.22);
      animation: drift 8s infinite ease-in-out;
      font-size: 18px;
    }

    @keyframes drift {
      0%,100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-25px) rotate(12deg);
      }
    }

    main {
      position: relative;
      z-index: 1;
      width: min(1100px, 92%);
      margin: auto;
      padding: 45px 0 70px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    .bird {
      font-size: 42px;
      margin-bottom: 4px;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(42px, 8vw, 76px);
      margin: 0;
      letter-spacing: 1px;
    }

    .subtitle {
      margin: 12px auto 0;
      max-width: 650px;
      color: #c9c9c9;
      font-size: 16px;
      line-height: 1.6;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 25px 0;
    }

    button,
    .file-label {
      border: 1px solid #555;
      background: #191919;
      color: white;
      padding: 11px 17px;
      border-radius: 999px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: .2s;
    }

    button:hover,
    .file-label:hover {
      background: #2a2a2a;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    #photoInput {
      display: none;
    }

    .owner-panel {
      display: none;
      max-width: 500px;
      margin: 0 auto 25px;
      padding: 18px;
      border: 1px solid #333;
      border-radius: 18px;
      background: rgba(20,20,20,.9);
    }

    .owner-panel.show {
      display: block;
    }

    .owner-panel h2 {
      margin: 0 0 12px;
      font-family: "Playfair Display", serif;
    }

    .owner-panel p {
      color: #aaa;
      font-size: 14px;
      margin: 6px 0 14px;
    }

    input[type="email"],
    input[type="password"],
    textarea {
      width: 100%;
      border: 1px solid #444;
      background: #0d0d0d;
      color: white;
      border-radius: 12px;
      padding: 11px 12px;
      font: inherit;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #888;
    }

    .login-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .login-row button {
      white-space: nowrap;
    }

    #status {
      text-align: center;
      min-height: 24px;
      color: #aaa;
      margin: 12px 0 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 18px;
    }

    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid #292929;
      border-radius: 18px;
      background: #111;
      box-shadow: 0 12px 35px rgba(0,0,0,.3);
    }

    .card img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #080808;
    }

    .card-content {
      padding: 13px;
    }

    .caption {
      min-height: 46px;
      resize: vertical;
    }

    .caption.view-only {
      border-color: transparent;
      background: transparent;
      padding: 0;
      color: #ddd;
      resize: none;
      pointer-events: none;
    }

    .delete {
      margin-top: 10px;
      width: 100%;
      display: none;
    }

    .owner-mode .delete {
      display: block;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 60px 20px;
      border: 1px dashed #333;
      border-radius: 18px;
      grid-column: 1 / -1;
    }

    .loading {
      text-align: center;
      color: #999;
      padding: 30px;
      grid-column: 1 / -1;
    }

    @media (max-width: 520px) {
      main {
        padding-top: 28px;
      }

      .login-row {
        flex-direction: column;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .card-content {
        padding: 9px;
      }

      button,
      .file-label {
        padding: 10px 14px;
      }
    }
  </style>
</head>

<body>

  <div class="stars" id="stars"></div>
  <div class="floating" id="floating"></div>

  <main>

    <header>
      <div class="bird">🕊️</div>

      <h1>hello angel17</h1>

      <div class="subtitle">
        hello angel17! Look how good you are at moderating!
      </div>
    </header>

    <div class="controls">

      <label class="file-label" id="addPhotoButton" style="display:none;">
        Add photo
        <input id="photoInput" type="file" accept="image/*" multiple>
      </label>

      <button id="musicButton">
        Play music
      </button>

      <button id="ownerButton">
        Owner login
      </button>

    </div>

    <section class="owner-panel" id="ownerPanel">

      <h2>Owner access</h2>

      <p>
        Sign in with the owner account you created in Supabase.
      </p>

      <input
        id="emailInput"
        type="email"
        placeholder="Supabase email"
      >

      <div class="login-row">

        <input
          id="passwordInput"
          type="password"
          placeholder="Password"
        >

        <button id="loginButton">
          Log in
        </button>

      </div>

      <button
        id="logoutButton"
        style="display:none; margin-top:10px;"
      >
        Log out
      </button>

    </section>

    <div id="status">
      Loading photos...
    </div>

    <section class="grid" id="photoGrid"></section>

  </main>

  <audio id="music" loop preload="auto">

    <source
      src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3"
      type="audio/mpeg"
    >

  </audio>

  <script>

    // ============================================================
    // SUPABASE SETTINGS
    // ============================================================

    const SUPABASE_URL =
      "https://kbdgytljnkoztmsidwpj.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_-DDq6623XRNrWQmSnT0Xpg_8_ESgpoF";

    const OWNER_ID =
      "4c553800-2043-456e-a815-edd45f626797";

    const BUCKET = "photos";


    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    const photoGrid =
      document.getElementById("photoGrid");

    const status =
      document.getElementById("status");

    const addPhotoButton =
      document.getElementById("addPhotoButton");

    const photoInput =
      document.getElementById("photoInput");

    const ownerButton =
      document.getElementById("ownerButton");

    const ownerPanel =
      document.getElementById("ownerPanel");

    const loginButton =
      document.getElementById("loginButton");

    const logoutButton =
      document.getElementById("logoutButton");

    const emailInput =
      document.getElementById("emailInput");

    const passwordInput =
      document.getElementById("passwordInput");


    let ownerMode = false;


    // ============================================================
    // STAR DECORATIONS
    // ============================================================

    for (let i = 0; i < 90; i++) {

      const star =
        document.createElement("span");

      star.className = "star";

      star.style.left =
        Math.random() * 100 + "%";

      star.style.top =
        Math.random() * 100 + "%";

      star.style.animationDelay =
        Math.random() * 3 + "s";

      document
        .getElementById("stars")
        .appendChild(star);
    }


    const symbols = ["✧", "✦", "✧", "✦"];

    for (let i = 0; i < 18; i++) {

      const el =
        document.createElement("span");

      el.className = "float";

      el.textContent =
        symbols[Math.floor(Math.random() * symbols.length)];

      el.style.left =
        Math.random() * 100 + "%";

      el.style.top =
        Math.random() * 100 + "%";

      el.style.animationDelay =
        Math.random() * 8 + "s";

      document
        .getElementById("floating")
        .appendChild(el);
    }


    // ============================================================
    // OWNER LOGIN
    // ============================================================

    ownerButton.addEventListener("click", () => {

      ownerPanel.classList.toggle("show");

    });


    async function checkOwner() {

      const { data } =
        await db.auth.getUser();

      const user = data.user;


      ownerMode =
        !!user && user.id === OWNER_ID;


      document.body.classList.toggle(
        "owner-mode",
        ownerMode
      );


      addPhotoButton.style.display =
        ownerMode ? "inline-flex" : "none";


      if (ownerMode) {

        ownerButton.textContent =
          "Owner panel";

        loginButton.style.display =
          "none";

        logoutButton.style.display =
          "block";

        emailInput.style.display =
          "none";

        passwordInput.style.display =
          "none";

        status.textContent =
          "Owner mode enabled.";

      } else {

        ownerButton.textContent =
          "Owner login";

        loginButton.style.display =
          "block";

        logoutButton.style.display =
          "none";

        emailInput.style.display =
          "block";

        passwordInput.style.display =
          "block";
      }


      await loadPhotos();

    }


    loginButton.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          status.textContent =
            "Enter your Supabase email and password.";

          return;
        }


        loginButton.disabled = true;

        status.textContent =
          "Logging in...";


        const { data, error } =
          await db.auth.signInWithPassword({

            email,
            password

          });


        loginButton.disabled = false;


        if (error) {

          status.textContent =
            "Login failed: " + error.message;

          return;
        }


        if (
          !data.user ||
          data.user.id !== OWNER_ID
        ) {

          await db.auth.signOut();

          status.textContent =
            "That account is not the website owner.";

          return;
        }


        passwordInput.value = "";

        status.textContent =
          "Owner logged in.";

        await checkOwner();

      }
    );


    logoutButton.addEventListener(
      "click",
      async () => {

        await db.auth.signOut();

        ownerMode = false;

        document.body.classList.remove(
          "owner-mode"
        );

        addPhotoButton.style.display =
          "none";

        emailInput.style.display =
          "block";

        passwordInput.style.display =
          "block";

        loginButton.style.display =
          "block";

        logoutButton.style.display =
          "none";

        ownerButton.textContent =
          "Owner login";

        status.textContent =
          "Logged out.";

        await loadPhotos();

      }
    );


    // ============================================================
    // LOAD PHOTOS
    // ============================================================

    async function loadPhotos() {

      photoGrid.innerHTML =
        '<div class="loading">Loading photos...</div>';


      const { data, error } =
        await db
          .from("photos")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(error);

        photoGrid.innerHTML =
          '<div class="empty">Could not load photos.</div>';

        status.textContent =
          "Database error: " + error.message;

        return;
      }


      photoGrid.innerHTML = "";


      if (!data || data.length === 0) {

        photoGrid.innerHTML = `

          <div class="empty">

            No photos yet ✧

            <br>

            <small>
              ${
                ownerMode
                  ? "Use Add photo to add the first one."
                  : "Check back later!"
              }
            </small>

          </div>

        `;

        if (!ownerMode) {
          status.textContent = "";
        }

        return;
      }


      data.forEach(createCard);


      if (ownerMode) {

        status.textContent =
          "Owner mode enabled.";

      } else {

        status.textContent = "";

      }

    }


    // ============================================================
    // CREATE PHOTO CARD
    // ============================================================

    function createCard(photo) {

      const card =
        document.createElement("article");

      card.className = "card";

      card.dataset.id =
        photo.id;


      const img =
        document.createElement("img");

      img.src =
        photo.photo_url;

      img.alt =
        "Memory photo";

      img.loading =
        "lazy";


      const content =
        document.createElement("div");

      content.className =
        "card-content";


      const caption =
        document.createElement("textarea");

      caption.className =
        "caption";

      caption.placeholder =
        "Write the description...";

      caption.value =
        photo.description || "";


      if (!ownerMode) {

        caption.classList.add(
          "view-only"
        );

        caption.readOnly = true;

      }


      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete";

      deleteButton.textContent =
        "Delete photo";


      deleteButton.addEventListener(
        "click",
        async () => {

          if (!ownerMode) return;


          if (!confirm("Delete this photo?")) {
            return;
          }


          deleteButton.disabled = true;

          status.textContent =
            "Deleting...";


          const path =
            getStoragePath(
              photo.photo_url
            );


          const { error: storageError } =
            await db
              .storage
              .from(BUCKET)
              .remove([path]);


          if (storageError) {

            console.error(storageError);

            status.textContent =
              "Could not delete image: " +
              storageError.message;

            deleteButton.disabled = false;

            return;
          }


          const { error: dbError } =
            await db
              .from("photos")
              .delete()
              .eq("id", photo.id);


          if (dbError) {

            console.error(dbError);

            status.textContent =
              "Image deleted, but database row failed: " +
              dbError.message;

            return;
          }


          card.remove();


          if (!photoGrid.children.length) {

            photoGrid.innerHTML = `

              <div class="empty">

                No photos yet ✧

                <br>

                <small>
                  Use Add photo to add one.
                </small>

              </div>

            `;

          }


          status.textContent =
            "Photo deleted.";

        }
      );


      let saveTimer;


      caption.addEventListener(
        "input",
        () => {

          if (!ownerMode) return;


          clearTimeout(saveTimer);


          saveTimer =
            setTimeout(
              async () => {

                const { error } =
                  await db
                    .from("photos")
                    .update({
                      description:
                        caption.value
                    })
                    .eq(
                      "id",
                      photo.id
                    );


                if (error) {

                  console.error(error);

                  status.textContent =
                    "Could not save description: " +
                    error.message;

                } else {

                  status.textContent =
                    "Description saved.";

                }

              },
              600
            );

        }
      );


      content.appendChild(caption);

      content.appendChild(
        deleteButton
      );


      card.appendChild(img);

      card.appendChild(content);

      photoGrid.appendChild(card);

    }


    // ============================================================
    // GET STORAGE FILE PATH
    // ============================================================

    function getStoragePath(photoUrl) {

      const marker =
        `/storage/v1/object/public/${BUCKET}/`;


      const index =
        photoUrl.indexOf(marker);


      if (index !== -1) {

        return decodeURIComponent(
          photoUrl.substring(
            index + marker.length
          )
        );

      }


      return "";

    }


    // ============================================================
    // UPLOAD PHOTOS
    // ============================================================

    photoInput.addEventListener(
      "change",
      async (event) => {

        if (!ownerMode) {

          status.textContent =
            "Only the owner can upload photos.";

          return;
        }


        const files =
          Array.from(
            event.target.files || []
          );


        if (!files.length) return;


        const { data } =
          await db.auth.getUser();


        if (
          !data.user ||
          data.user.id !== OWNER_ID
        ) {

          status.textContent =
            "Owner login required.";

          photoInput.value = "";

          return;
        }


        for (const file of files) {

          if (
            !file.type.startsWith("image/")
          ) {
            continue;
          }


          status.textContent =
            "Uploading " +
            file.name +
            "...";


          const extension =
            file.name
              .split(".")
              .pop()
              .toLowerCase();


          const fileName =
            crypto.randomUUID() +
            "." +
            extension;


          const filePath =
            OWNER_ID +
            "/" +
            fileName;


          const { error: uploadError } =
            await db
              .storage
              .from(BUCKET)
              .upload(
                filePath,
                file,
                {
                  cacheControl: "3600",
                  upsert: false
                }
              );


          if (uploadError) {

            console.error(uploadError);

            status.textContent =
              "Upload failed: " +
              uploadError.message;

            continue;
          }


          const { data: publicData } =
            db
              .storage
              .from(BUCKET)
              .getPublicUrl(
                filePath
              );


          const { error: insertError } =
            await db
              .from("photos")
              .insert({

                photo_url:
                  publicData.publicUrl,

                description:
                  ""

              });


          if (insertError) {

            console.error(insertError);


            await db
              .storage
              .from(BUCKET)
              .remove([
                filePath
              ]);


            status.textContent =
              "Database save failed: " +
              insertError.message;

            continue;
          }

        }


        photoInput.value = "";

        await loadPhotos();

      }
    );


    // ============================================================
    // MUSIC
    // ============================================================

    const music =
      document.getElementById("music");

    const musicButton =
      document.getElementById(
        "musicButton"
      );


    musicButton.addEventListener(
      "click",
      async () => {

        try {

          if (music.paused) {

            await music.play();

            musicButton.textContent =
              "Pause music";

          } else {

            music.pause();

            musicButton.textContent =
              "Play music";

          }

        } catch (error) {

          status.textContent =
            "Music could not start. Tap the button again.";

        }

      }
    );


    // ============================================================
    // START WEBSITE
    // ============================================================

    db.auth.onAuthStateChange(() => {

      setTimeout(
        checkOwner,
        0
      );

    });


    checkOwner();

  </script>

</body>
</html>
